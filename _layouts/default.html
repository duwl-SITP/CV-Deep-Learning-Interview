<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>
    {% if page.title %}
      {{ page.title }} |
    {% endif %}
    {{ site.title }}
  </title>

  <style>
    :root {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --border: #d0d7de;
      --border-strong: #b1bac4;
      --accent: #0969da;
      --accent-hover: #0550ae;
      --code-bg: rgba(175, 184, 193, 0.2);
      --quote: #656d76;
      --shadow: 0 1px 2px rgba(31, 35, 40, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      background: var(--bg);
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(9, 105, 218, 0.07), transparent 28%),
        linear-gradient(180deg, #f6f8fa 0%, #eef2f6 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .site-shell {
      min-height: 100vh;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(246, 248, 250, 0.88);
      border-bottom: 1px solid rgba(208, 215, 222, 0.9);
    }

    .site-header__inner,
    .site-main {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
    }

    .site-header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
    }

    .site-brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .site-brand__title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }

    .site-brand__meta {
      margin: 0;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .site-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .site-nav a {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
    }

    .site-nav a:hover {
      color: var(--text);
      background: rgba(208, 215, 222, 0.32);
      border-color: rgba(208, 215, 222, 0.72);
      text-decoration: none;
    }

    .site-main {
      padding: 32px 0 56px;
    }

    .page-card {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .page-card__hero {
      padding: 28px 32px 20px;
      background:
        linear-gradient(135deg, rgba(9, 105, 218, 0.08), rgba(9, 105, 218, 0.01)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.98));
      border-bottom: 1px solid var(--border);
    }

    .page-card__eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .page-card__title {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      line-height: 1.2;
      font-weight: 700;
    }

    .page-card__description {
      max-width: 72ch;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .markdown-body {
      padding: 32px;
      font-size: 1rem;
      word-wrap: break-word;
    }

    .markdown-body > :first-child {
      margin-top: 0;
    }

    .markdown-body > :last-child {
      margin-bottom: 0;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      margin-top: 1.6em;
      margin-bottom: 0.8em;
      font-weight: 600;
      line-height: 1.25;
    }

    .markdown-body h1,
    .markdown-body h2 {
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border);
    }

    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body blockquote,
    .markdown-body table,
    .markdown-body pre {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 2em;
    }

    .markdown-body li + li {
      margin-top: 0.25em;
    }

    .markdown-body hr {
      height: 1px;
      padding: 0;
      margin: 24px 0;
      background-color: var(--border);
      border: 0;
    }

    .markdown-body blockquote {
      padding: 0 1em;
      color: var(--quote);
      border-left: 0.25em solid var(--border);
    }

    .markdown-body code {
      padding: 0.2em 0.4em;
      background: var(--code-bg);
      border-radius: 6px;
      font-size: 0.9em;
      font-family: ui-monospace, SFMono-Regular, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .markdown-body pre {
      overflow: auto;
      padding: 16px;
      background: #f6f8fa;
      border: 1px solid var(--border);
      border-radius: 12px;
      line-height: 1.45;
    }

    .markdown-body pre code {
      padding: 0;
      background: transparent;
      border-radius: 0;
      font-size: 0.875rem;
    }

    .markdown-body table {
      display: block;
      width: max-content;
      max-width: 100%;
      overflow: auto;
      border-spacing: 0;
      border-collapse: collapse;
    }

    .markdown-body th,
    .markdown-body td {
      padding: 6px 13px;
      border: 1px solid var(--border);
    }

    .markdown-body tr {
      background-color: var(--panel);
      border-top: 1px solid var(--border-strong);
    }

    .markdown-body tr:nth-child(2n) {
      background-color: #f6f8fa;
    }

    .markdown-body img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 20px auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    .site-footer {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto 24px;
      color: var(--muted);
      font-size: 0.875rem;
      text-align: center;
    }

    @media (max-width: 720px) {
      .site-header__inner {
        align-items: flex-start;
        flex-direction: column;
        padding: 12px 0;
      }

      .site-main {
        width: min(980px, calc(100% - 20px));
        padding-top: 20px;
      }

      .page-card__hero,
      .markdown-body {
        padding: 20px;
      }
    }
  </style>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
  </script>

</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="site-header__inner">
        <div class="site-brand">
          <p class="site-brand__title">{{ site.title }}</p>
          {% if site.description %}
          <p class="site-brand__meta">{{ site.description }}</p>
          {% endif %}
        </div>
        <nav class="site-nav" aria-label="Primary">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/record/index.html' | relative_url }}">Archive</a>
          <a href="{{ '/README.html' | relative_url }}">README</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <article class="page-card">
        <div class="page-card__hero">
          <h1 class="page-card__title">{{ page.title | default: site.title }}</h1>
          {% if page.description or site.description %}
          <p class="page-card__description">{{ page.description | default: site.description }}</p>
          {% endif %}
        </div>
        <div class="markdown-body">
          {{ content }}
        </div>
      </article>
    </main>

  </div>
</body>
</html>
